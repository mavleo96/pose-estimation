name: pose
channels:
  - xformers
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - pip
  - python=3.10
  - pip:
    - torch
    - torchvision
    - omegaconf
    - torchmetrics
    - fvcore
    - iopath
    # - xformers==0.0.18
    - opencv-python 
    - pycocotools 
    - matplotlib 
    - onnxruntime 
    - onnx
    - scipy
    - ffmpeg
    - hydra-colorlog
    - hydra-core
    - gdown
    - pytorch-lightning
    - pandas
    - ruamel.yaml
    - pyrender
    - wandb
    - distinctipy
    - blenderproc
    - transformers
    - numpy
    - scikit-image
    - pypng
    - imageio
    - h5py
    - seaborn
    - bokeh
    - open3d
    - pin
    - embreex
    - trimesh
    - git+https://github.com/thodan/bop_toolkit.git
    - tensorboard
    - einops
    - vispy
    - PyOpenGL
    - ipykernel
    - black
    - isort
variables:
  PYOPENGL_PLATFORM: osmesa
